---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    _tftp_directory:
      default: &default /var/lib/tftpboot
      Debian: /srv/tftp
      Ubuntu-18: *default
      Suse: /srv/tftpboot
    tftp_directory: "{{ _tftp_directory[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_tftp_directory[ansible_facts['os_family']] | default(_tftp_directory['default'])) }}"
    # Debian/Ubuntu dropped the "tftp" transitional package (tftp-hpa is
    # the real client package name and has always existed alongside it).
    tftp_client_package: "{{ 'tftp-hpa' if ansible_facts['os_family'] == 'Debian' else 'tftp' }}"

  tasks:
    - name: Install tftp client
      ansible.builtin.package:
        name: "{{ tftp_client_package }}"
        state: present
      notify:
        - Uninstall tftp client

    - name: Touch {{ tftp_directory }}/test
      ansible.builtin.file:
        path: "{{ tftp_directory }}/test"
        mode: "0777"
        state: touch
      notify:
        - Remove test

    - name: Put /etc/passwd to test
      ansible.builtin.command:
        cmd: tftp localhost -c put /etc/passwd test
      changed_when: false

  handlers:
    - name: Uninstall tftp client
      ansible.builtin.package:
        name: "{{ tftp_client_package }}"
        state: absent

    - name: Remove test
      ansible.builtin.file:
        path: "{{ tftp_directory }}/test"
        state: absent
